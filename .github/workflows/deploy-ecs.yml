name: Deploy to AWS ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 690322985895.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: wingman-vip/app
  ECS_CLUSTER: wingman-vip-cluster
  ECS_SERVICE: wingman-vip-service
  TASK_DEFINITION_FAMILY: wingman-vip
  CONTAINER_NAME: wingman-vip-app

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC authentication with AWS
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deploy role cannot iam:PassRole the task role, so it cannot register a new
      # task definition revision. When the live task definition runs the :latest tag
      # (pushed above), a forced redeploy pulls the new image with no new revision.
      - name: Check the live task definition uses the :latest tag
        run: |
          TD=$(aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].taskDefinition' --output text)
          IMAGE=$(aws ecs describe-task-definition --task-definition "$TD" \
            --query "taskDefinition.containerDefinitions[?name=='${{ env.CONTAINER_NAME }}'].image | [0]" --output text)
          echo "Live task definition: $TD"
          echo "Live image: $IMAGE"
          case "$IMAGE" in
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest"|"${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}") ;;
            *) echo "::error::Live task definition pins $IMAGE, not :latest; a forced redeploy would not pick up the new image. Grant iam:PassRole on the task role to the deploy role."; exit 1 ;;
          esac

      - name: Force a new deployment and wait for it to stabilise
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment --query 'service.deployments[0].id' --output text
          aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }}

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "Cluster: ${{ env.ECS_CLUSTER }}"
          echo "Service: ${{ env.ECS_SERVICE }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check ECS service events and CloudWatch logs."
          echo "Log group: /ecs/wingman-vip"
